<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d17"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1136"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="lightGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.08)}}@keyframes flowRight{0%{stroke-dashoffset:200}}@keyframes floatParticle1{0%{transform:translate(0,0);opacity:.2}50%{transform:translate(30px,-20px);opacity:.8}}@keyframes floatParticle2{0%{transform:translate(0,0);opacity:.3}50%{transform:translate(-25px,25px);opacity:.9}}@keyframes orbitNode{0%{transform:rotate(0deg) translateX(45px) rotate(0deg)}}@keyframes pillFloat{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.bg-box{fill:url(#bgGradient)}.grid-line{stroke:#334155;stroke-opacity:.18;stroke-width:1}.particle-1{animation:floatParticle1 6s ease-in-out infinite}.particle-2{animation:floatParticle2 7s ease-in-out infinite}.pulse-element{animation:pulseGlow 4s ease-in-out infinite;transform-origin:center}.flow-line{stroke-dasharray:12,12;animation:flowRight 4s linear infinite}.pill-animated-1{animation:pillFloat 4.5s ease-in-out infinite}.pill-animated-2{animation:pillFloat 5s ease-in-out infinite .7s}.pill-animated-3{animation:pillFloat 4.2s ease-in-out infinite 1.4s}.pill-animated-4{animation:pillFloat 4.8s ease-in-out infinite 2.1s}.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:42px;letter-spacing:-.5px;fill:#fff}.title-gradient{fill:url(#primaryGrad)}.badge-label,.subtitle-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;font-size:16px;letter-spacing:.5px;fill:#94a3b8}.badge-label{font-weight:600;font-size:13px;letter-spacing:.3px}</style><rect width="1200" height="360" class="bg-box" rx="16"/><g class="grid-layer"><line x1="80" x2="80" y1="0" y2="360" class="grid-line"/><line x1="240" x2="240" y1="0" y2="360" class="grid-line"/><line x1="400" x2="400" y1="0" y2="360" class="grid-line"/><line x1="560" x2="560" y1="0" y2="360" class="grid-line"/><line x1="720" x2="720" y1="0" y2="360" class="grid-line"/><line x1="880" x2="880" y1="0" y2="360" class="grid-line"/><line x1="1040" x2="1040" y1="0" y2="360" class="grid-line"/><line x1="0" x2="1200" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1200" y1="120" y2="120" class="grid-line"/><line x1="0" x2="1200" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1200" y1="300" y2="300" class="grid-line"/></g><circle cx="180" cy="80" r="120" fill="#38bdf8" class="pulse-element" filter="url(#glow)" opacity=".12"/><circle cx="1020" cy="270" r="140" fill="#c084fc" class="pulse-element" filter="url(#glow)" opacity=".14"/><g opacity=".35"><path fill="none" stroke="url(#primaryGrad)" stroke-width="2" d="M 50 18