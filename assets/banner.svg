<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1136" />
    </linearGradient>

    <!-- Glowing Text & Border Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Particle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-box { fill: url(#bgGradient); }
    .grid-line { stroke: #334155; stroke-opacity: 0.18; stroke-width: 1; }
    
    /* Animation Keyframes */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes flowRight {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle1 {
      0% { transform: translate(0, 0); opacity: 0.2; }
      50% { transform: translate(30px, -20px); opacity: 0.8; }
      100% { transform: translate(0, 0); opacity: 0.2; }
    }
    @keyframes floatParticle2 {
      0% { transform: translate(0, 0); opacity: 0.3; }
      50% { transform: translate(-25px, 25px); opacity: 0.9; }
      100% { transform: translate(0, 0); opacity: 0.3; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
    }
    @keyframes pillFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .particle-1 { animation: floatParticle1 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 7s ease-in-out infinite; }
    .pulse-element { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .flow-line {
      stroke-dasharray: 12, 12;
      animation: flowRight 4s linear infinite;
    }
    .pill-animated-1 { animation: pillFloat 4.5s ease-in-out infinite; }
    .pill-animated-2 { animation: pillFloat 5s ease-in-out infinite 0.7s; }
    .pill-animated-3 { animation: pillFloat 4.2s ease-in-out infinite 1.4s; }
    .pill-animated-4 { animation: pillFloat 4.8s ease-in-out infinite 2.1s; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .title-gradient {
      fill: url(#primaryGrad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" class="bg-box" />

  <!-- Subtle Cyber Tech Grid in Background -->
  <g class="grid-layer">
    <line x1="80" y1="0" x2="80" y2="360" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="360" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="360" class="grid-line" />
    <line x1="880" y1="0" x2="880" y2="360" class="grid-line" />
    <line x1="1040" y1="0" x2="1040" y2="360" class="grid-line" />

    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Ambient Glowing Orbs (Deep in background) -->
  <circle cx="180" cy="80" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-element" />
  <circle cx="1020" cy="270" r="140" fill="#c084fc" opacity="0.14" filter="url(#glow)" class="pulse-element" />

  <!-- Animated Stream / Pipeline Flow in Background (Behind Text) -->
  <g opacity="0.35">
    <path d="M 50 180 Q 300 240, 600 180 T 1150 180" fill="none" stroke="url(#primaryGrad)" stroke-width="2" class="flow-line" />
    <path d="M 80 210 Q 330 150, 630 210 T 1120 210" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,8" class="flow-line" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="210" cy="140" r="3.5" fill="#38bdf8" filter="url(#lightGlow)" class="particle-1" />
  <circle cx="340" cy="250" r="2.5" fill="#818cf8" filter="url(#lightGlow)" class="particle-2" />
  <circle cx="920" cy="110" r="4" fill="#c084fc" filter="url(#lightGlow)" class="particle-1" />
  <circle cx="1060" cy="210" r="3" fill="#38bdf8" filter="url(#lightGlow)" class="particle-2" />
  <circle cx="150" cy="280" r="2.5" fill="#f472b6" filter="url(#lightGlow)" class="particle-1" />

  <!-- Clean Frame Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="1.2" opacity="0.45" />

  <!-- TOP DECORATIVE ACCENT PILL -->
  <g transform="translate(460, 32)">
    <rect width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="14" r="5" fill="#10b981" filter="url(#lightGlow)" />
    <text x="32" y="19" fill="#38bdf8" class="badge-label" font-size="11">AWESOME ECOSYSTEM ARCHIVE</text>
  </g>

  <!-- FOREGROUND TITLE & SUBTITLE (High Contrast, Guaranteed Clean Legibility) -->
  <g transform="translate(600, 125)" text-anchor="middle">
    <text class="title-text" y="0">
      ⚡ Awesome <tspan class="title-gradient">LLM Token Optimization</tspan>
    </text>
    <text class="subtitle-text" y="38">
      Curated Architectures, Gateways, Prompt Compression, Semantic Caching &amp; Cost Governance
    </text>
    <text class="subtitle-text" y="64" font-size="14" fill="#64748b">
      Maximize Context Window Efficiency • Slash Inference Costs • Zero Quality Degradation
    </text>
  </g>

  <!-- FOREGROUND INTERACTIVE-STYLE PILLS (Decorated, Floating safely below text) -->
  <g transform="translate(145, 252)">
    <!-- Pill 1: Prompt Compression -->
    <g class="pill-animated-1" transform="translate(0, 0)">
      <rect width="205" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
      <circle cx="24" cy="21" r="9" fill="#0284c7" opacity="0.3" />
      <text x="24" y="25" text-anchor="middle" font-size="13">🗜️</text>
      <text x="44" y="26" fill="#e2e8f0" class="badge-label">Prompt Compression</text>
    </g>

    <!-- Pill 2: Intelligent Routing -->
    <g class="pill-animated-2" transform="translate(230, 0)">
      <rect width="205" height="42" rx="21" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7" />
      <circle cx="24" cy="21" r="9" fill="#4f46e5" opacity="0.3" />
      <text x="24" y="25" text-anchor="middle" font-size="13">🔀</text>
      <text x="44" y="26" fill="#e2e8f0" class="badge-label">Intelligent Routing</text>
    </g>

    <!-- Pill 3: Semantic Caching -->
    <g class="pill-animated-3" transform="translate(460, 0)">
      <rect width="205" height="42" rx="21" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.7" />
      <circle cx="24" cy="21" r="9" fill="#9333ea" opacity="0.3" />
      <text x="24" y="25" text-anchor="middle" font-size="13">⚡</text>
      <text x="44" y="26" fill="#e2e8f0" class="badge-label">Semantic Caching</text>
    </g>

    <!-- Pill 4: Cost Governance -->
    <g class="pill-animated-4" transform="translate(690, 0)">
      <rect width="215" height="42" rx="21" fill="#0f172a" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.7" />
      <circle cx="24" cy="21" r="9" fill="#059669" opacity="0.3" />
      <text x="24" y="25" text-anchor="middle" font-size="13">🛡️</text>
      <text x="44" y="26" fill="#e2e8f0" class="badge-label">Cost &amp; Quota Governance</text>
    </g>
  </g>

  <!-- Bottom Accent Indicator Dots -->
  <g transform="translate(600, 335)" text-anchor="middle">
    <circle cx="-20" cy="0" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="0" cy="0" r="4" fill="#818cf8" opacity="0.8" />
    <circle cx="20" cy="0" r="3" fill="#c084fc" opacity="0.6" />
  </g>
</svg>
